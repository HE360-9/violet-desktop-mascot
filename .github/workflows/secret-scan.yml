name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block tracked config.env
        run: |
          set -e
          if git ls-files --error-unmatch config.env >/dev/null 2>&1; then
            echo "::error file=config.env::config.env must never be committed — it holds your API key."
            exit 1
          fi
          echo "OK: config.env is not tracked."

      - name: Scan for API keys and private keys
        run: |
          set -e
          PATTERN='sk-[A-Za-z0-9]{20,}|ark-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|-----BEGIN [A-Z ]*PRIVATE KEY'
          if git grep -nE "$PATTERN" -- . ':!*.example' ':!README*' ':!docs/*'; then
            echo "::error::Possible real secret found. Remove it, rotate the key, and rewrite history if it was pushed."
            exit 1
          fi
          echo "OK: no secret-like patterns in tracked files."

      - name: Ensure .gitignore still covers secrets
        run: |
          set -e
          for p in config.env .env; do
            if ! grep -qE "^\s*\*?\.?env|^config\.env|^\*\.env" .gitignore; then
              echo "::error file=.gitignore::.gitignore no longer ignores env files."
              exit 1
            fi
          done
          echo "OK: .gitignore covers env files."
